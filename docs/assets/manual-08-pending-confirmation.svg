<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="850" viewBox="0 0 1360 850" role="img" aria-labelledby="title desc">
<title id="title">Manual illustration: payment waiting for confirmation</title>
<desc id="desc">Sanitized illustrative interface view. A broadcast is pending; no transaction ID or wallet data is shown.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
<rect width="1360" height="850" fill="#f5f7fa"/><rect x="3" y="3" width="1354" height="844" rx="18" fill="none" stroke="#f47b20" stroke-width="6"/><rect x="12" y="12" width="1336" height="260" rx="14" fill="#101a26"/>
<text x="45" y="52" fill="#b9c8d7" font-size="14" font-weight="750" letter-spacing="1.4">BITCOIN EASY SIGNER · V0.6.2 · EXPERIMENTAL</text><text x="46" y="110" fill="#f4f7fb" font-size="42" font-weight="760">Bitcoin Easy Signer</text><text x="48" y="154" fill="#c3cfda" font-size="18">A payment has been broadcast and is waiting for one confirmation.</text>
<rect x="44" y="310" width="1272" height="380" rx="16" fill="#fffefa" stroke="#d9e0e7"/><rect x="76" y="344" width="1208" height="110" rx="12" fill="#fff4df" stroke="#e5ba69" stroke-width="2"/><text x="106" y="388" fill="#70430d" font-size="25" font-weight="750">Payment sent · waiting for confirmation</text><text x="106" y="424" fill="#70430d" font-size="16">You can make another payment from this wallet after one confirmation.</text>
<text x="80" y="510" fill="#18212b" font-size="17" font-weight="650">The network has received the payment. It may take time to be added to a block.</text><text x="80" y="548" fill="#586777" font-size="16">A missing status is not confirmation. Check again later; do not retry blindly.</text><rect x="78" y="590" width="165" height="42" rx="21" fill="#147c70"/><text x="99" y="617" fill="#fff" font-size="15" font-weight="700">Check again</text><text x="80" y="660" fill="#586777" font-size="14">Example only · no transaction identifier or wallet information displayed</text></svg>