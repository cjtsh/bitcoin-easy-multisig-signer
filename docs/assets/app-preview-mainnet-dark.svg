<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="850" viewBox="0 0 1360 850" role="img" aria-labelledby="title desc">
<title id="title">Bitcoin Easy Signer on Bitcoin mainnet, dark theme</title>
<desc id="desc">Sanitized illustrative interface view based on Bitcoin Easy Signer version 0.6.2. No wallet identifiers or live payment data are shown.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
<rect width="1360" height="850" fill="#111820"/>
<rect x="3" y="3" width="1354" height="844" rx="18" fill="none" stroke="#f47b20" stroke-width="6"/>
<rect x="12" y="12" width="1336" height="260" rx="14" fill="#101a26" stroke="#101a26" stroke-width="1"/>
<text x="45" y="52" fill="#b9c8d7" font-size="14" font-weight="750" letter-spacing="1.4">BITCOIN EASY SIGNER · V0.6.2 · COMMUNITY SOFTWARE</text>
<rect x="1170" y="28" width="145" height="38" rx="19" fill="#304356" stroke="#304356" stroke-width="1"/><text x="1185" y="53" fill="#fff" font-size="14" font-weight="700" >Light Theme</text>
<text x="46" y="110" fill="#f4f7fb" font-size="42" font-weight="760" >Bitcoin Easy Signer</text>
<text x="48" y="147" fill="#c3cfda" font-size="18" font-weight="400" >Open an existing multisig wallet, review a payment, and approve it on the required</text>
<text x="48" y="174" fill="#c3cfda" font-size="18" font-weight="400" >hardware signers. The app never holds a key.</text>
<text x="48" y="216" fill="#f4f7fb" font-size="19" font-weight="700" >For a spouse, trustee, lawyer, accountant, or family member.</text>
<rect x="44" y="304" width="1272" height="55" rx="12" fill="#fff3e8" stroke="#e9a06b" stroke-width="2"/>
<text x="67" y="339" fill="#853f12" font-size="17" font-weight="700" >⚠  LIVE BITCOIN NETWORK · REAL FUNDS. Check the wallet file, destination and fee.</text>
<rect x="44" y="384" width="1272" height="395" rx="16" fill="#1b2632" stroke="#344252" stroke-width="1"/>
<text x="77" y="429" fill="#f3f6fa" font-size="27" font-weight="750" >1. Open your existing wallet</text>
<text x="78" y="465" fill="#bac5d1" font-size="16" font-weight="400" >Choose the wallet definition, not a recovery phrase or private key.</text>
<text x="78" y="514" fill="#f3f6fa" font-size="16" font-weight="700" >BSMS wallet file</text>
<rect x="77" y="532" width="1206" height="58" rx="10" fill="#263545" stroke="#344252" stroke-width="1"/>
<rect x="94" y="542" width="142" height="38" rx="19" fill="#405064" stroke="#405064" stroke-width="1"/><text x="109" y="567" fill="#63c4b5" font-size="14" font-weight="700" >Choose File</text>
<text x="258" y="568" fill="#bac5d1" font-size="16" font-weight="400" >No file selected</text>
<rect x="80" y="621" width="20" height="20" rx="3" fill="none" stroke="#bac5d1" stroke-width="1"/>
<text x="115" y="638" fill="#bac5d1" font-size="15" font-weight="400" >I understand a public explorer will see my wallet’s public addresses.</text>
<rect x="78" y="687" width="260" height="38" rx="19" fill="#63c4b5" stroke="#63c4b5" stroke-width="1"/><text x="93" y="712" fill="#fff" font-size="14" font-weight="700" >Open wallet &amp; check balance</text>
<text x="78" y="750" fill="#bac5d1" font-size="14" font-weight="400" >Your network is shown in the badge and window frame.</text>
<rect x="1076" y="225" width="230" height="34" rx="18" fill="#402b20" stroke="#f49a52" stroke-width="2"/>
<text x="1094" y="248" fill="#ffe0c2" font-size="13" font-weight="750" >● BITCOIN LIVE · REAL BTC</text><rect x="844" y="225" width="218" height="34" rx="17" fill="none" stroke="#8091a2" stroke-width="1.5"/><text x="862" y="247" fill="#f4f7fb" font-size="13" font-weight="700">Enter Developer Mode</text>
</svg>
