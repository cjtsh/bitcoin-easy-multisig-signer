<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="850" viewBox="0 0 1360 850" role="img" aria-labelledby="title desc">
<title id="title">Manual illustration: reviewing a payment</title>
<desc id="desc">Sanitized illustrative interface view based on Bitcoin Easy Signer version 0.6.2. No wallet identifiers or live payment data are shown.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
<rect width="1360" height="850" fill="#f5f7fa"/>
<rect x="3" y="3" width="1354" height="844" rx="18" fill="none" stroke="#f47b20" stroke-width="6"/>
<rect x="12" y="12" width="1336" height="260" rx="14" fill="#101a26" stroke="#101a26" stroke-width="1"/>
<text x="45" y="52" fill="#b9c8d7" font-size="14" font-weight="750" letter-spacing="1.4">BITCOIN EASY SIGNER · V0.6.2 · COMMUNITY SOFTWARE</text>
<rect x="1170" y="28" width="145" height="38" rx="19" fill="#304356" stroke="#304356" stroke-width="1"/><text x="1185" y="53" fill="#fff" font-size="14" font-weight="700" >Dark Theme</text>
<text x="46" y="110" fill="#f4f7fb" font-size="42" font-weight="760" >Bitcoin Easy Signer</text>
<text x="48" y="147" fill="#c3cfda" font-size="18" font-weight="400" >Open an existing multisig wallet, review a payment, and approve it on the required</text>
<text x="48" y="174" fill="#c3cfda" font-size="18" font-weight="400" >hardware signers. The app never holds a key.</text>
<text x="48" y="216" fill="#f4f7fb" font-size="19" font-weight="700" >For a spouse, trustee, lawyer, accountant, or family member.</text>
<rect x="44" y="304" width="1272" height="454" rx="14" fill="#ffffff" stroke="#d9e0e7" stroke-width="1"/>
<text x="77" y="352" fill="#18212b" font-size="27" font-weight="750" >5. Review the payment</text>
<text x="78" y="390" fill="#586777" font-size="16" font-weight="400" >Stop and compare every item with the recipient and wallet software.</text>
<rect x="78" y="422" width="1203" height="65" rx="8" fill="#eaf1f7" stroke="#d9e0e7" stroke-width="1"/>
<text x="101" y="450" fill="#586777" font-size="14" font-weight="400" >Destination</text>
<text x="320" y="462" fill="#18212b" font-size="17" font-weight="650" >Full recipient address shown here</text>
<rect x="78" y="500" width="580" height="65" rx="8" fill="#eaf1f7" stroke="#d9e0e7" stroke-width="1"/>
<text x="101" y="528" fill="#586777" font-size="14" font-weight="400" >Amount</text>
<text x="320" y="540" fill="#18212b" font-size="17" font-weight="650" >Exact amount to send</text>
<rect x="680" y="500" width="601" height="65" rx="8" fill="#eaf1f7" stroke="#d9e0e7" stroke-width="1"/>
<text x="703" y="528" fill="#586777" font-size="14" font-weight="400" >Network fee</text>
<text x="925" y="540" fill="#18212b" font-size="17" font-weight="650" >Absolute fee and fee rate</text>
<rect x="78" y="578" width="1203" height="77" rx="8" fill="#eaf1f7" stroke="#d9e0e7" stroke-width="1"/>
<text x="101" y="608" fill="#586777" font-size="14" font-weight="400" >Change</text>
<text x="320" y="610" fill="#18212b" font-size="16" font-weight="650" >Address and amount returning to this wallet</text>
<text x="320" y="636" fill="#586777" font-size="14" font-weight="400" >Verify in your wallet software; many devices do not display change.</text>
<text x="80" y="697" fill="#9a4a18" font-size="15" font-weight="700" >If anything is missing or unexpected, stop. Do not approve.</text>
<rect x="78" y="711" width="188" height="38" rx="19" fill="#147c70" stroke="#147c70" stroke-width="1"/><text x="93" y="736" fill="#fff" font-size="14" font-weight="700" >Continue to signers</text>
</svg>
