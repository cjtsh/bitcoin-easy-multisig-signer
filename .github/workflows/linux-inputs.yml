name: Produce the reviewed Linux build inputs

# Not a release workflow. This produces the one input the Linux build cannot
# generate for itself, so that a human can look at it and pin it before any
# artifact is built from it:
#
#   linux-desktop-lock  requirements-desktop-linux.lock, because
#                       requirements-desktop.lock is macOS-resolved: it contains
#                       no platform markers at all and its wheels are the macOS
#                       ones, so `pip install --require-hashes` cannot use it
#                       here.
#
# Deliberately NOT generated inside a release build. A build that resolves its
# own dependencies has nothing to compare against; the point of committing the
# lock is the review in between. Run this once, review what it prints, commit the
# file it names, and then build Linux through the unified pipeline
# (build-candidate.yml, linux job). The standalone build-linux.yml is deleted
# and must not return. See LINUX-PORT.md.
#
# It has a push trigger for the same first-run reason the standalone workflow
# had: a workflow that exists only on a non-default branch is not offered in the
# "Run workflow" list until it has run once. The path filter keeps it quiet after
# that, so it only re-runs when the thing it produces from actually changes.
# This recipe publishes nothing — it neither grants repository write access nor
# runs a release command — which is why scripts/check-publish-paths.sh allows it
# to stay on a branch. (CT-102: the old wording spelled out the matcher patterns
# this sweep looks for, so the comment itself read as a publisher.)
on:
  push:
    branches:
      - linux-port
    paths:
      - .github/workflows/linux-inputs.yml
      - requirements-desktop-linux.txt
      - requirements.txt
      - vendor/embit-0.8.2+besa.1-py3-none-any.whl
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    name: Linux desktop lock
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # HWI 3.2.0 (the bundled hardware-wallet dependency) requires <3.13.
          # Full patch, not the bare minor: 3.12.10 is the newest 3.12 with
          # linux/win32/darwin assets in actions/python-versions (3.12.11+ are
          # Linux-only), and a bare "3.12" floats to this runner's tool cache.
          # Keep this in agreement with every python-version site in
          # build-candidate.yml.
          python-version: "3.12.10"
      - name: Compile a Linux-resolved desktop lock
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-piptools.lock
          # Same flags as the macOS lock, so the two files can be read side by
          # side. The command line is recorded in the file itself.
          python -m piptools compile --allow-unsafe --generate-hashes \
            --output-file requirements-desktop-linux.lock requirements-desktop-linux.txt
          # A resolved Linux lock must contain the platform's wheels and no
          # other platform's. Each of these has been resolved for macOS or
          # Windows in the sibling lock files, so their presence here would mean
          # this lock was not produced on Linux.
          for package in hidapi libusb1; do
            grep -q "^${package}==" requirements-desktop-linux.lock \
              || { echo "the lock does not pin ${package}, so it was not resolved on Linux"; exit 1; }
          done
          if grep -Eq '^(pyobjc|macholib|pythonnet|pywebview)==' requirements-desktop-linux.lock; then
            echo "the lock pins a wheel from another platform or a window toolkit Linux does not use"
            exit 1
          fi
          echo '--- requirements-desktop-linux.lock ---'
          cat requirements-desktop-linux.lock
          echo "sha256: $(sha256sum requirements-desktop-linux.lock | awk '{print $1}')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-desktop-lock
          path: requirements-desktop-linux.lock
          if-no-files-found: error
