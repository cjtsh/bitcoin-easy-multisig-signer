name: Produce reviewed Windows build inputs

# Not a release workflow. This produces the two inputs the Windows build cannot
# generate for itself, so that a human can look at them and pin them before any
# artifact is built from them:
#
#   windows-libusb        vendor/libusb-1.0.dll, built from the pinned libusb
#                         1.0.30 source tarball already under vendor/
#   windows-desktop-lock  requirements-desktop-windows.lock, because
#                         requirements-desktop.lock is macOS-resolved
#
# Both are deliberately NOT generated inside build-windows.yml. A build that
# resolves its own dependencies or compiles its own native library at build time
# has nothing to compare against; the point of committing them is the review in
# between. Run this once, review what it prints, commit the files it names, and
# then dispatch build-windows.yml. See WINDOWS-PORT.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    name: Windows desktop lock
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # HWI 3.2.0 (the bundled hardware-wallet dependency) requires <3.13.
          python-version: "3.12"
      - name: Compile a Windows-resolved desktop lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check pip-tools
          # Same flags as the macOS lock, so the two files can be read side by side.
          python -m piptools compile --allow-unsafe --generate-hashes `
            --output-file requirements-desktop-windows.lock requirements-desktop.txt
          if ($LASTEXITCODE -ne 0) { throw 'pip-compile failed.' }
          # A resolved Windows lock must contain these and no macOS-only wheel.
          Select-String -Path requirements-desktop-windows.lock -Pattern '^pythonnet==' -Quiet |
            ForEach-Object { if (-not $_) { throw 'the lock does not pin pythonnet, so it was not resolved on Windows' } }
          if (Select-String -Path requirements-desktop-windows.lock -Pattern 'pyobjc|macholib' -Quiet) {
            throw 'the lock pins a macOS-only wheel'
          }
          Write-Host '--- requirements-desktop-windows.lock ---'
          Get-Content requirements-desktop-windows.lock
          Write-Host "sha256: $((Get-FileHash requirements-desktop-windows.lock -Algorithm SHA256).Hash.ToLowerInvariant())"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-desktop-lock
          path: requirements-desktop-windows.lock
          if-no-files-found: error

  libusb:
    name: Windows libusb DLL
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify the vendored libusb source before using it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf'
          $actual = (Get-FileHash vendor\libusb-1.0.30.tar.bz2 -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "vendor\libusb-1.0.30.tar.bz2 does not match its reviewed digest (expected $expected, got $actual)."
          }
          Write-Host "libusb source digest verified: $actual"
      - name: Build libusb 1.0.30 for x64 with MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path .windows-inputs -Force | Out-Null
          tar -xjf vendor\libusb-1.0.30.tar.bz2 -C .windows-inputs
          if (-not (Test-Path .windows-inputs\libusb-1.0.30\CMakeLists.txt)) { throw 'the tarball did not unpack as expected' }
          cmake -S .windows-inputs\libusb-1.0.30 -B .windows-inputs\cmake-build `
            -G 'Visual Studio 17 2022' -A x64 `
            -DLIBUSB_BUILD_EXAMPLES=OFF -DLIBUSB_BUILD_TESTS=OFF `
            -DLIBUSB_BUILD_TESTING=OFF -DLIBUSB_BUILD_BENCHMARKS=OFF `
            -DLIBUSB_ENABLE_UDEV=OFF
          if ($LASTEXITCODE -ne 0) { throw 'cmake configure failed' }
          cmake --build .windows-inputs\cmake-build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'cmake build failed' }
          # The licence must be the same file the repository ships, because the DLL
          # is redistributed under it.
          if (-not (Get-FileHash .windows-inputs\libusb-1.0.30\COPYING -Algorithm SHA256).Hash.Equals(
                  (Get-FileHash vendor\libusb-COPYING -Algorithm SHA256).Hash)) {
            throw 'libusb-COPYING differs from the licence inside the pinned tarball'
          }
      - name: Collect and describe the DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $found = @(Get-ChildItem .windows-inputs -Recurse -Filter 'libusb-1.0.dll' | Where-Object { $_.FullName -match 'Release|bin' })
          if ($found.Count -eq 0) {
            Get-ChildItem .windows-inputs -Recurse -Filter '*.dll' | ForEach-Object { Write-Host $_.FullName }
            throw 'no libusb-1.0.dll was produced'
          }
          # Newest last-modified wins; libusb's MSVC tree can hold a stale copy.
          $dll = $found | Sort-Object LastWriteTime | Select-Object -Last 1
          Copy-Item $dll.FullName .windows-inputs\libusb-1.0.dll -Force
          $digest = (Get-FileHash .windows-inputs\libusb-1.0.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "libusb-1.0.dll sha256: $digest" | Set-Content .windows-inputs\libusb-1.0.dll.sha256
          Write-Host "libusb-1.0.dll sha256: $digest"
          Write-Host '--- what to commit, once you have verified the DLL yourself ---'
          Write-Host "  vendor/libusb-1.0.dll            # from the windows-libusb artifact"
          Write-Host "  scripts/build-windows.ps1        # `$reviewedLibusbSha256 = '$digest'"
          Write-Host "  tests/test_libusb_vendor.py      # the win32 entry of REVIEWED"
          Write-Host "  vendor/README.md                 # the provenance paragraph"
          Write-Host "  repository variable LIBUSB_WINDOWS_SHA256 = $digest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-libusb
          path: |
            .windows-inputs/libusb-1.0.dll
            .windows-inputs/libusb-1.0.dll.sha256
          if-no-files-found: error
