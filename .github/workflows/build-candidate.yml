name: Build macOS DMG and release

# Deliberately simple: pushing to the build branch builds the app, verifies it,
# and publishes a NORMAL GitHub release (not a pre-release) for the version in
# version.py. Bumping version.py is the only edit needed for a new version --
# no version number is hardcoded anywhere in this file.
#
# Re-running for a version that already has a release replaces it, so iterating
# on a test build stays a one-push operation.
on:
  push:
    branches:
      - phase2-transaction-builder
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: read
        run: |
          echo "version=$(python3 -c 'import version; print(version.APP_VERSION)')" >> "$GITHUB_OUTPUT"

  source:
    name: Source archive and tests
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      # PyYAML is only needed to lint the workflow itself, so it is installed
      # here rather than added to the application's dependency list.
      - run: python -m pip install --quiet pyyaml
      - run: python -m unittest discover -s tests -q
      - run: bash scripts/build-source.sh ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-archive
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    name: Apple Silicon DMG
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: brew install libusb
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - name: Build the DMG
        # Without the LIBUSB_SHA256 repository variable the build still succeeds
        # but prints a loud warning that the bundled native library is unverified.
        # Set that variable to the reviewed digest to arm the integrity gate.
        env:
          LIBUSB_SHA256: ${{ vars.LIBUSB_SHA256 }}
        run: bash scripts/build-macos.sh ${{ needs.version.outputs.version }}
      - name: Verify the DMG, the signature and the bundled app
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          app="dist/Bitcoin Easy Signer.app"
          exe="$app/Contents/MacOS/Bitcoin Easy Signer"
          hdiutil verify "dist/Bitcoin-Easy-Signer-v${version}-UNSIGNED-TEST.dmg"
          test -f "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/hwi"
          "$app/Contents/MacOS/hwi" --help >/dev/null
          codesign --verify --strict "$app"
          "$exe" --check-bundle
          "$exe" --check-network
          # Prove the app trusts the CA store it SHIPS, not the build machine's.
          # With the ambient trust paths removed, only the bundled store can make
          # this succeed. Without this, a build that ignores its bundle still
          # passes on a runner that happens to have system CA files.
          echo "Re-checking HTTPS with the ambient trust store removed:"
          env -u SSL_CERT_FILE SSL_CERT_DIR=/nonexistent/certs "$exe" --check-network
          SSL_CERT_FILE=/nonexistent/ca.pem SSL_CERT_DIR=/nonexistent/certs "$exe" --check-network
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    needs: [version, source, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-archive
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-dmg
          path: dist
      - name: Write SHA256SUMS
        run: |
          cd dist
          shasum -a 256 *.tar.gz *.dmg > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sha256sums
          path: dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, source, macos, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-archive
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-dmg
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sha256sums
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          cat > notes.md <<EOF
          ## v${VERSION} — Apple Silicon test build

          Unsigned, unnotarized test build from the \`phase2-transaction-builder\` branch.

          - Opens an existing BSMS 2-of-3 multisig wallet and checks its public balance.
          - Prepares and reviews an **unsigned** transaction: a partial amount or Send All
            with the fee deducted, live slow/medium/fast sat/vB suggestions, a
            UTXO-based size estimate, the fee in sats and indicative USD, and an extra
            confirmation for large amounts.
          - Saves the unsigned \`.psbt\`, then identifies connected hardware signers with
            bundled Bitcoin Core HWI 3.2.0.
          - It never asks for a PIN or seed, and it does not sign or broadcast.

          Downloads: \`Bitcoin-Easy-Signer-v${VERSION}-UNSIGNED-TEST.dmg\` (Apple Silicon) and
          \`bitcoin-easy-multisig-signer-v${VERSION}.tar.gz\` (source).
          Verify either file against \`SHA256SUMS\`.

          Experimental and unaudited: verify every address, amount and fee on your signers.
          EOF
          # Replace an existing release for this version rather than failing, so a
          # repeated push simply refreshes the test build.
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1 || true
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v${VERSION} — unsigned Apple Silicon test build" \
            --notes-file notes.md dist/*
