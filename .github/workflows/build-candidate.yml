name: Build and publish v0.1.7 test release

on:
  push:
    branches:
      - phase2-transaction-builder
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: bash scripts/build-source.sh 0.1.7
      - uses: actions/upload-artifact@v4
        with:
          name: source-0.1.7
          path: dist/easy-bitcoin-multisig-signer-v0.1.7.tar.gz
          if-no-files-found: error

  macos-apple-silicon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: bash scripts/build-macos.sh 0.1.7
      - name: Check DMG and app resources
        run: |
          hdiutil verify dist/Easy-Bitcoin-Multisig-v0.1.7-UNSIGNED-TEST.dmg
          test -f "dist/Easy Bitcoin Multisig.app/Contents/Info.plist"
          "dist/Easy Bitcoin Multisig.app/Contents/MacOS/Easy Bitcoin Multisig" --check-bundle
          "dist/Easy Bitcoin Multisig.app/Contents/MacOS/Easy Bitcoin Multisig" --check-network
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-macos-apple-silicon-0.1.7
          path: dist/Easy-Bitcoin-Multisig-v0.1.7-UNSIGNED-TEST.dmg
          if-no-files-found: error

  publish-test-release:
    if: github.event_name == 'push'
    needs: [source, macos-apple-silicon]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-0.1.7
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-macos-apple-silicon-0.1.7
          path: dist
      - name: Publish GitHub prerelease with both downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## v0.1.7 test build

          This is a test build for the owner's Testnet4 transaction preparation workflow. It is built from the `phase2-transaction-builder` branch and is not merged into `main`.

          This version clarifies why a limited wallet scan can block sending. Partial sends pay the selected network fee in addition to the entered amount; Send All deducts the fee from the available balance. This build prepares transactions but does not sign or broadcast them.

          Included downloads:
          - **Mac (Apple Silicon):** unsigned, unnotarized test DMG.
          - **Linux/source:** source archive; requires the documented environment.

          GitHub Actions passed the automated test suite and packaging checks. Please treat this as an owner test build; first-open macOS security prompts are expected for an unsigned app.
          EOF
          gh release create v0.1.7             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "v0.1.7 — transaction preparation test build"             --prerelease             --notes-file release-notes.md             dist/Easy-Bitcoin-Multisig-v0.1.7-UNSIGNED-TEST.dmg             dist/easy-bitcoin-multisig-signer-v0.1.7.tar.gz
