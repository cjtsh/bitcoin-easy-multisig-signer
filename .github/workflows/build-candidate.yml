name: Build release candidate (no publishing)

on:
  push:
    branches:
      - candidate-v0.1.1-macos
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: bash scripts/build-source.sh 0.1.1
      - uses: actions/upload-artifact@v4
        with:
          name: source-0.1.1
          path: dist/easy-bitcoin-multisig-signer-v0.1.1.tar.gz
          if-no-files-found: error

  macos-apple-silicon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: bash scripts/build-macos.sh 0.1.1
      - name: Check DMG and app resources
        run: |
          hdiutil verify dist/Easy-Bitcoin-Multisig-v0.1.1-UNSIGNED-TEST.dmg
          test -f "dist/Easy Bitcoin Multisig.app/Contents/Info.plist"
          "dist/Easy Bitcoin Multisig.app/Contents/MacOS/Easy Bitcoin Multisig" --check-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-macos-apple-silicon-0.1.1
          path: dist/Easy-Bitcoin-Multisig-v0.1.1-UNSIGNED-TEST.dmg
          if-no-files-found: error