name: Build all platform artifacts and release

# Explicit dispatch only. A push cannot publish a money-moving app. The version
# and tag are immutable once released; failed candidate runs may be corrected
# and dispatched again before publication.
#
# One pipeline builds every platform from the same commit in the same run:
# macOS (signed and notarized on the release path), Windows x64 and Linux
# x86_64 (unsigned by policy; see SIGNING.md), the source archive, one CI-
# generated SHA256SUMS over every asset, a GPG-signed SHA256SUMS.asc on the
# publish path, and Sigstore provenance attestations.
#
# This is the repository's only publish path. The retired per-platform
# workflows (build-windows.yml, build-linux.yml) have been deleted from every
# branch, and scripts/check-publish-paths.sh — run as a gate on every dispatch
# — refuses the run if any non-main ref ever carries a workflow that can
# publish. Read it before trusting this comment: a comment that overclaims a
# control is itself a finding, and this one used to.
#
# Two independent choices, because building and publishing are not the same act:
#   notarize=true  build the artifact that would be published
#   publish=false  build it, upload it to the run, and publish nothing at all
on:
  workflow_dispatch:
    inputs:
      notarize:
        description: "Notarize the DMG for public distribution. Needs the Apple credentials; off builds an unsigned test DMG."
        type: boolean
        default: false
      publish:
        description: "Publish the GitHub release. Off builds a candidate: the artifacts stay on the run, with no tag and no release."
        type: boolean
        default: false
      candidate_run_id:
        description: "Successful notarized publish=false run for this exact commit; required when publish=true so the tested bytes are promoted."
        type: string
        required: false

permissions:
  contents: read

jobs:
  version:
    name: Read version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Refuse a second publish path on any ref
        run: |
          set -euo pipefail
          if ! bash scripts/check-publish-paths.sh origin; then
            echo 'A non-main ref can publish. Delete it before any release is cut.' >&2
            exit 1
          fi
      - name: Refuse an unsigned public release
        if: ${{ inputs.publish && !inputs.notarize }}
        run: |
          echo 'Publishing requires a signed and notarized build.' >&2
          exit 1
      - name: Require the default branch for publication
        if: ${{ inputs.publish }}
        env:
          # CT-98: a workflow_dispatch input is attacker-shaped text. Interpolated
          # as ${{ }} it is spliced into this script BEFORE bash parses it, so a
          # value like `1; something` runs here, in the release gate. It travels
          # through the environment instead, where the numeric test below can
          # judge it as data. The checksums job already passes it this way.
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'Public releases must be dispatched from main.' >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo 'Publishing requires the run ID of a successful notarized candidate.' >&2
            exit 1
          fi
      - id: read
        run: |
          echo "version=$(python3 -c 'import version; print(version.APP_VERSION)')" >> "$GITHUB_OUTPUT"

  source:
    name: Source archive and tests
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # HWI 3.2.0 (the bundled hardware-wallet dependency) requires <3.13.
          # Pin the FULL patch, not the bare minor. setup-python resolves "3.12"
          # to whatever each runner's tool cache holds, so the 2026-10-06
          # candidate run built one commit on 3.12.10 (Windows), 3.12.14 (source)
          # and 3.12.15 (Linux) — CT-55. 3.12.10 is the newest 3.12 that
          # actions/python-versions still ships for linux-x64, win32-x64 AND
          # darwin-arm64; 3.12.11 and later are Linux-only assets and would not
          # install on the Windows or macOS jobs. Every python-version site must
          # carry this same full patch — tests/test_workflow_config.py enforces
          # it. Keep the lock files on the same 3.12 line until HWI is upgraded.
          python-version: "3.12.10"
      - run: python -m pip install --require-hashes -r requirements.lock
      # PyYAML is only needed to lint the workflow itself. Its separate hash lock
      # keeps it out of the packaged application's dependency list. The suite
      # below refuses to pass with skips: the README's
      # documented test command omitted PyYAML and silently skipped the whole
      # workflow-lint module, which looks exactly like success.
      - run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Run the suite and refuse a silent skip
        run: |
          set -euo pipefail
          output="$(python -m unittest discover -s tests 2>&1)" || status=$?
          echo "$output"
          if [ "${status:-0}" -ne 0 ]; then
            echo "The test suite failed." >&2
            exit 1
          fi
          if grep -qE "skipped=[1-9]" <<<"$output"; then
            echo "Tests were skipped; a dependency is missing." >&2
            exit 1
          fi
      - name: Run the UI DOM tests
        run: |
          set -euo pipefail
          # Glob, not a list: a new tests/ui_*.cjs must run without a workflow edit.
          for test in tests/ui_*.cjs; do
            echo "== $test"
            node "$test"
          done
      - run: bash scripts/build-source.sh ${{ needs.version.outputs.version }}
      # Run the tests FROM the archive. An archive missing a test helper still
      # builds and still uploads, so nothing caught it until the tests were run
      # out of the extracted tarball.
      - name: Run the tests from the archive itself
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          tar xzf "dist/bitcoin-easy-multisig-signer-v${version}.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/bitcoin-easy-multisig-signer-v${version}"
          python -m unittest discover -s tests -q
          for test in tests/ui_*.cjs; do
            echo "== $test"
            node "$test"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-archive
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    name: Apple Silicon DMG
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Same HWI <3.13 constraint as the source job; do not bump one alone.
          # Full patch, same reason as the source job: 3.12.10 is the newest 3.12
          # with darwin assets. A bare "3.12" floats to this runner's tool cache.
          python-version: "3.12.10"
      - name: Verify the vendored libusb input
        env:
          LIBUSB_SHA256: ${{ vars.LIBUSB_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$LIBUSB_SHA256" || { echo 'Set the reviewed LIBUSB_SHA256 repository variable.' >&2; exit 1; }
          expected="$(printf '%s' "$LIBUSB_SHA256" | tr '[:upper:]' '[:lower:]')"
          dylib="vendor/libusb-1.0.0.dylib"
          test -f "$dylib" || { echo 'Vendored libusb input is missing.' >&2; exit 1; }
          actual="$(shasum -a 256 "$dylib" | awk '{print $1}')"
          test "$expected" = "$actual" || { echo 'Unexpected vendored libusb binary; refusing the build.' >&2; exit 1; }
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Run the suite and refuse a silent skip
        run: |
          set -euo pipefail
          output="$(python -m unittest discover -s tests 2>&1)" || status=$?
          echo "$output"
          if [ "${status:-0}" -ne 0 ]; then
            echo "The test suite failed." >&2
            exit 1
          fi
          if grep -qE "skipped=[1-9]" <<<"$output"; then
            echo "Tests were skipped; a dependency is missing." >&2
            exit 1
          fi
      - name: Run the UI DOM tests
        run: |
          set -euo pipefail
          # Glob, not a list: a new tests/ui_*.cjs must run without a workflow edit.
          for test in tests/ui_*.cjs; do
            echo "== $test"
            node "$test"
          done
      - name: The signed-release path must fail closed without credentials
        run: |
          set -euo pipefail
          # RELEASE=1 is the notarized path. It must refuse to build rather than
          # quietly produce an ad-hoc-signed artifact, and CI can prove that
          # without holding Apple credentials it does not have.
          if RELEASE=1 bash scripts/build-macos.sh "${{ needs.version.outputs.version }}" >release-guard.txt 2>&1; then
            echo "RELEASE=1 built without signing credentials; that must not happen." >&2
            exit 1
          fi
          cat release-guard.txt
          grep -q "requires MAC_SIGN_IDENTITY and a notarisation credential" release-guard.txt
      - name: A requested notarized build must fail closed without credentials
        # The later cert import refuses an empty secret. This proves the same
        # about the notary credentials, so a "notarized" run cannot quietly
        # produce an ad-hoc-signed DMG instead.
        if: ${{ inputs.notarize }}
        run: |
          set -euo pipefail
          if RELEASE=1 bash scripts/build-macos.sh "${{ needs.version.outputs.version }}" >notary-guard.txt 2>&1; then
            echo "RELEASE=1 built without a notarisation credential; that must not happen." >&2
            exit 1
          fi
          cat notary-guard.txt
          grep -q "MAC_NOTARY_KEY_PATH, MAC_NOTARY_KEY_ID and MAC_NOTARY_ISSUER_ID" notary-guard.txt \
            || grep -q "Notarisation credentials are set incompletely" notary-guard.txt
      - name: Prepare hash-locked build environment before signing secrets
        run: PREPARE_ONLY=1 bash scripts/build-macos.sh ${{ needs.version.outputs.version }}
      - name: Import the Developer ID certificate
        # Only the notarized path needs a signing identity. An unsigned test build
        # must keep working without any Apple credentials.
        if: ${{ inputs.notarize }}
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MAC_CERT_P12_BASE64:?MAC_CERT_P12_BASE64 is not set, so there is nothing to sign with}"
          : "${MAC_CERT_PASSWORD:?MAC_CERT_PASSWORD is not set}"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          # openssl, not base64: BSD base64 has no portable --decode.
          printf '%s' "$MAC_CERT_P12_BASE64" | tr -d '\n' \
            | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          # Put the temporary keychain first, keeping whatever else the runner had.
          existing="$(security list-keychains -d user | sed 's/^[[:space:]]*//; s/"//g' | tr '\n' ' ')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Provide notary credentials
        # Two routes, because a keychain profile cannot travel to a runner but an
        # Apple ID can. Whichever secret exists decides:
        #   App Store Connect API key  -> the key triple build-macos.sh takes directly
        #   Apple ID + app-specific pw -> the SAME keychain profile the local build
        #                                 uses, rebuilt here, so the script needs no
        #                                 special case for CI.
        # This exists because App Store Connect API access needs an Admin role and a
        # separate Apple approval; the Apple ID route needs neither and is what the
        # owner already validated locally.
        if: ${{ inputs.notarize }}
        env:
          APPLE_ID: ${{ vars.MAC_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.MAC_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ vars.MAC_TEAM_ID }}
          KEY_P8_BASE64: ${{ secrets.MAC_NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ vars.MAC_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ vars.MAC_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${KEY_P8_BASE64:-}" ]]; then
            : "${KEY_ID:?MAC_NOTARY_KEY_ID is not set}"
            : "${ISSUER_ID:?MAC_NOTARY_ISSUER_ID is not set}"
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$KEY_P8_BASE64" | tr -d '\n' \
              | openssl base64 -d -A -out "$key"
            chmod 600 "$key"
            {
              echo "MAC_NOTARY_KEY_PATH=$key"
              echo "MAC_NOTARY_KEY_ID=$KEY_ID"
              echo "MAC_NOTARY_ISSUER_ID=$ISSUER_ID"
            } >> "$GITHUB_ENV"
            echo "Notarisation will use an App Store Connect API key."
          else
            : "${APPLE_ID:?MAC_APPLE_ID is not set, and no API key is configured either}"
            : "${APP_PASSWORD:?MAC_APP_SPECIFIC_PASSWORD is not set}"
            : "${TEAM_ID:?MAC_TEAM_ID is not set}"
            xcrun notarytool store-credentials "eas-notary" \
              --apple-id "$APPLE_ID" --password "$APP_PASSWORD" --team-id "$TEAM_ID"
            echo "MAC_NOTARY_PROFILE=eas-notary" >> "$GITHUB_ENV"
            echo "Notarisation will use the Apple ID credential profile."
          fi
      - name: Build the DMG
        # Mandatory integrity gate: build-macos.sh refuses an unset/mismatched digest.
        env:
          LIBUSB_SHA256: ${{ vars.LIBUSB_SHA256 }}
          # RELEASE=1 is the notarized path. It is opt-in per dispatch and fails
          # closed when the credentials are absent, so a dispatched release can
          # never quietly ship an ad-hoc-signed artifact.
          RELEASE: ${{ inputs.notarize && '1' || '0' }}
          BUILD_DEPS_PREPARED: '1'
          MAC_SIGN_IDENTITY: ${{ inputs.notarize && vars.MAC_SIGN_IDENTITY || '' }}
          # The notary credential — a profile name, or the API key triple — is
          # exported by the "Provide notary credentials" step, so it arrives through
          # the environment rather than being duplicated here.
        run: bash scripts/build-macos.sh ${{ needs.version.outputs.version }}
      - name: Verify the DMG, the signature and the bundled app
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          app="dist/Bitcoin Easy Signer.app"
          exe="$app/Contents/MacOS/Bitcoin Easy Signer"
          # Whichever path ran, exactly one DMG must exist. Not mapfile: the macOS
          # runner's bash is 3.2.
          test "$(find dist -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')" = 1
          dmg="$(find dist -maxdepth 1 -name '*.dmg' | head -1)"
          echo "Verifying $dmg"
          hdiutil verify "$dmg"
          test -f "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/hwi"
          "$app/Contents/MacOS/hwi" --help >/dev/null
          # 0.3.0 sends signing commands through stdin; prove the packaged HWI
          # parses that path, without needing a real signer on the CI runner.
          printf '%s\n' 'enumerate' | "$app/Contents/MacOS/hwi" --chain test --stdin > "$RUNNER_TEMP/hwi-stdin.json"
          python3 -m json.tool "$RUNNER_TEMP/hwi-stdin.json" >/dev/null
          # The bundle must carry the icon, not PyInstaller's stock one.
          icon_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")"
          test -n "$icon_name"
          icon_path="$(find "$app/Contents/Resources" -maxdepth 1 -name '*.icns' | head -1)"
          test -n "$icon_path"
          test "$(head -c 4 "$icon_path")" = "icns"
          codesign --verify --strict "$app"
          "$exe" --check-bundle
          "$exe" --check-save
          "$exe" --check-network
          # Proves the frozen app finds its bundled HWI, loads the bundled
          # libusb and parses its JSON -- the part no test can cover unbuilt.
          "$exe" --check-devices
          # Prove the app trusts the CA store it SHIPS, not the build machine's.
          # With the ambient trust paths removed, only the bundled store can make
          # this succeed. Without this, a build that ignores its bundle still
          # passes on a runner that happens to have system CA files.
          echo "Re-checking HTTPS with the ambient trust store removed:"
          env -u SSL_CERT_FILE SSL_CERT_DIR=/nonexistent/certs "$exe" --check-network
          SSL_CERT_FILE=/nonexistent/ca.pem SSL_CERT_DIR=/nonexistent/certs "$exe" --check-network
      - name: Inventory the built dependencies
        env:
          LIBUSB_SHA256: ${{ vars.LIBUSB_SHA256 }}
        run: |
          .build-venv/bin/python scripts/build-sbom.py \
            --libusb-sha "$LIBUSB_SHA256" --output dist/BUILD-SBOM.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
            dist/BUILD-SBOM.json
          if-no-files-found: error
      - name: Remove the temporary keychain
        # Always, so a failed build cannot leave a signing keychain on the runner.
        if: ${{ always() && inputs.notarize }}
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/AuthKey.p8" || true
          if [[ -f "$RUNNER_TEMP/signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          fi

  windows:
    name: Windows x64 bundle
    needs: version
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Full patch, same reason as the source job: 3.12.10 is the newest 3.12
          # with win32 assets. A bare "3.12" floats to this runner's tool cache,
          # which is how this job built on 3.12.10 while Linux built on 3.12.15.
          python-version: "3.12.10"
      - name: Require an x64 Windows runner
        run: |
          set -euo pipefail
          architecture="${PROCESSOR_ARCHITEW6432:-$PROCESSOR_ARCHITECTURE}"
          if [[ "$architecture" != "AMD64" ]]; then
            echo "This job builds a 64-bit Windows bundle; the runner reports $architecture." >&2
            exit 1
          fi
      - name: Verify the Windows build inputs are present
        run: |
          set -euo pipefail
          missing=()
          # Neither of these can be produced on the machine that writes this
          # workflow: the lock must be resolved on Windows and the DLL must be
          # compiled on Windows. They are generated once by
          # .github/workflows/windows-inputs.yml, reviewed, and committed.
          [[ -f requirements-desktop-windows.lock ]] || missing+=(requirements-desktop-windows.lock)
          [[ -f vendor/libusb-1.0.dll ]] || missing+=(vendor/libusb-1.0.dll)
          if (( ${#missing[@]} )); then
            echo "Missing Windows build input(s): ${missing[*]}" >&2
            echo "Dispatch .github/workflows/windows-inputs.yml, review its artifacts," >&2
            echo "and commit them as vendor/README.md explains." >&2
            exit 1
          fi
      - name: Verify the vendored libusb input
        env:
          LIBUSB_SHA256: ${{ vars.LIBUSB_WINDOWS_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "${LIBUSB_SHA256:-}" ]]; then
            echo "Set the LIBUSB_WINDOWS_SHA256 repository variable to the reviewed" >&2
            echo "SHA-256 of vendor/libusb-1.0.dll before building a release." >&2
            exit 1
          fi
          expected="$(printf '%s' "$LIBUSB_SHA256" | tr 'A-Z' 'a-z')"
          observed_line="$(sha256sum vendor/libusb-1.0.dll)"
          observed="${observed_line%% *}"
          if [[ "$observed" != "$expected" ]]; then
            echo "vendor/libusb-1.0.dll does not match LIBUSB_WINDOWS_SHA256." >&2
            echo "  expected $expected" >&2
            echo "  observed $observed" >&2
            exit 1
          fi
      - name: Install the locked app dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - name: Install the locked CI-only dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.lock
      - name: Run the suite and refuse a silent skip
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee suite.log
          if grep -qE 'skipped=[1-9]' suite.log; then
            echo "==> A test skipped itself; the Windows job has no excuse for that." >&2
            exit 1
          fi
      - name: Run the UI DOM tests
        run: |
          set -euo pipefail
          for test in tests/ui_*.cjs; do
            echo "==> $test"
            node "$test"
          done
      # Dependencies are installed and the lock digest is recorded BEFORE the
      # build runs, so a build that needs to install something is a visible
      # failure rather than a quiet network fetch halfway through.
      - name: Prepare the hash-locked build environment
        shell: pwsh
        env:
          PREPARE_ONLY: "1"
        run: ./scripts/build-windows.ps1 -Version "${{ needs.version.outputs.version }}"
      - name: Build the Windows bundle
        shell: pwsh
        env:
          LIBUSB_SHA256: ${{ vars.LIBUSB_WINDOWS_SHA256 }}
          BUILD_DEPS_PREPARED: "1"
        run: ./scripts/build-windows.ps1 -Version "${{ needs.version.outputs.version }}"
      - name: Verify the built bundle
        run: |
          set -euo pipefail
          app="dist/Bitcoin Easy Signer"
          exe="$app/Bitcoin Easy Signer.exe"
          hwi="$app/hwi.exe"
          test -f "$exe" || { echo "Missing $exe" >&2; exit 1; }
          test -f "$hwi" || { echo "Missing $hwi" >&2; exit 1; }
          "$hwi" --help > hwi-help.log
          printf '%s\n' 'enumerate' | "$hwi" --chain test --stdin > hwi-stdin.json
          python -m json.tool < hwi-stdin.json > /dev/null
          # The app's own headless self-checks. A --windowed executable has no
          # console on Windows: sys.stdout is None, so its prints vanish and the
          # runner's pipe would look exactly like a check that never ran. The app
          # mirrors every result into DSH_DESKTOP_CHECK_LOG, which is the evidence
          # read below; the pipe is kept so a failure can be shown in full.
          for flag in --check-bundle --check-save --check-network --check-devices; do
            name="${flag#--}"
            export DSH_DESKTOP_CHECK_LOG="$name.log"
            if ! "$exe" "$flag" > "$name.stdout.log" 2>&1; then
              echo "==> $flag failed:" >&2
              { cat "$name.stdout.log" 2>/dev/null; cat "$name.log" 2>/dev/null; } >&2
              exit 1
            fi
            if [[ ! -s "$name.log" ]]; then
              echo "==> $flag reported nothing; a silent pass is not a pass." >&2
              exit 1
            fi
            cat "$name.log"
          done
          unset DSH_DESKTOP_CHECK_LOG
          # A host with a CA file configured must not be what makes HTTPS work.
          # On Windows the OS certificate store is the ambient source of trust, so
          # the load-bearing check is --check-bundle above: it asserts that the
          # BUNDLED store is the one the app configured for use.
          SSL_CERT_FILE=/nonexistent/ca.pem "$exe" --check-network > ca-file.log 2>&1
          SSL_CERT_DIR=/nonexistent/certs "$exe" --check-network > ca-dir.log 2>&1
      # The inventory comes first because the layout check reads dist/BUILD-SBOM.json
      # and refuses a release that ships without one.
      - name: Inventory the built dependencies
        env:
          LIBUSB_SHA256: ${{ vars.LIBUSB_WINDOWS_SHA256 }}
        run: |
          set -euo pipefail
          ./.build-venv/Scripts/python.exe scripts/build-sbom.py \
            --libusb-sha "$LIBUSB_SHA256" --output dist/BUILD-SBOM.json
      - name: Check the bundle's layout, icon and archive
        run: |
          set -euo pipefail
          ./.build-venv/Scripts/python.exe scripts/verify-windows-bundle.py \
            --version "${{ needs.version.outputs.version }}" \
            --sbom dist/BUILD-SBOM.json
      - name: Name the SBOM for one shared release page
        run: mv dist/BUILD-SBOM.json dist/BUILD-SBOM-windows-x64.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-bundle
          path: |
            dist/*.zip
            dist/BUILD-SBOM-windows-x64.json
          if-no-files-found: error

  linux:
    name: Linux x86_64 AppImage
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # HWI 3.2.0 (the bundled hardware-wallet dependency) requires <3.13.
          # Full patch, same reason as the source job. This runner is the one
          # that WOULD resolve a bare "3.12" to 3.12.15, which is why the three
          # jobs of the 2026-10-06 run disagreed.
          python-version: "3.12.10"
      - name: Install the test dependencies
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements.lock
          # PyYAML only lints the workflow; its own lock keeps it out of the
          # packaged application. Without it the lint module skips, and a skip
          # looks exactly like success.
          python -m pip install --require-hashes -r requirements-ci.lock
      - name: Run the suite and refuse a silent skip
        run: |
          set -euo pipefail
          output="$(python -m unittest discover -s tests 2>&1)" || status=$?
          echo "$output"
          if [ "${status:-0}" -ne 0 ]; then
            echo "The test suite failed." >&2
            exit 1
          fi
          if grep -qE "skipped=[1-9]" <<<"$output"; then
            echo "Tests were skipped; a dependency is missing." >&2
            exit 1
          fi
          for test in tests/ui_*.cjs; do
            echo "== $test"
            node "$test"
          done
      - name: Install the packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # squashfs-tools provides mksquashfs, the AppImage payload format.
          # librsvg2-bin rasterises assets/icon.svg into the AppDir icon.
          # fuse3 provides fusermount3, which a mounted AppImage needs; libfuse2
          # is deliberately NOT installed, so these checks prove the pinned
          # runtime never asks for libfuse.so.2.
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools librsvg2-bin build-essential fuse3
      - name: Prepare the hash-locked build environment
        env:
          # The lock is resolved on Linux and pinned by hash; this step is the
          # only place it is installed, so a lock that does not match its
          # requirements file fails here rather than inside a build.
          PREPARE_ONLY: "1"
        run: scripts/build-linux.sh "${{ needs.version.outputs.version }}"
      - name: Build the AppImage and the tarball
        env:
          BUILD_DEPS_PREPARED: "1"
        run: scripts/build-linux.sh "${{ needs.version.outputs.version }}"
      - name: Prove the AppImage starts where libfuse.so.2 is absent
        # The published promise is that a downloaded AppImage does not need the
        # host's libfuse.so.2 -- the library whose absence has always made one
        # do nothing at all on a current Ubuntu. Only a machine without it can
        # prove that, so this step refuses to run where it is installed, shows
        # the launcher's runtime asks no dynamic loader for anything, starts the
        # AppImage the way a user does, and then does it again inside a
        # container image that carries no libfuse2 at all.
        run: |
          set -euo pipefail
          appimage="$(ls dist/Bitcoin-Easy-Signer-*-linux-x86_64.AppImage)"
          chmod 755 "$appimage"

          if ldconfig -p | grep -qE 'libfuse\.so\.2'; then
            echo "::error::libfuse.so.2 is installed on this runner, so a pass here would prove nothing."
            exit 1
          fi

          # The runtime prefix is the launcher. A static-pie binary names no
          # interpreter and no shared library, so there is nothing for the host
          # to be missing. (It does carry libfuse's licence text; the check is
          # about the loader's own view of the file, not about strings.)
          mkdir -p build
          "./$appimage" --appimage-offset > build/offset
          head -c "$(cat build/offset)" "$appimage" > build/runtime
          chmod 755 build/runtime
          file build/runtime
          python3 - <<'ELF'
          import struct
          import sys

          raw = open("build/runtime", "rb").read()
          if raw[:4] != b"\x7fELF":
              sys.exit("the AppImage runtime is not an ELF binary")
          phoff, = struct.unpack_from("<Q", raw, 32)
          phentsize, phnum = struct.unpack_from("<HH", raw, 54)
          interpreter = None
          dynamic = None
          for index in range(phnum):
              start = phoff + index * phentsize
              p_type, _flags, p_offset, _vaddr, _paddr, p_filesz = struct.unpack_from(
                  "<IIQQQQ", raw, start
              )
              if p_type == 3:
                  interpreter = raw[p_offset:p_offset + p_filesz].split(b"\0")[0]
              if p_type == 2:
                  dynamic = (p_offset, p_filesz)
          if interpreter is not None:
              sys.exit("the AppImage runtime asks for a dynamic loader: " + interpreter.decode())
          needed = []
          if dynamic is not None:
              offset, size = dynamic
              for index in range(size // 16):
                  tag, _value = struct.unpack_from("<qQ", raw, offset + index * 16)
                  if tag == 0:
                      break
                  if tag == 1:
                      needed.append(index)
          if needed:
              sys.exit("the AppImage runtime names " + str(len(needed)) + " shared library dependency(ies)")
          print("The AppImage runtime is static-pie: no dynamic loader, no shared library named.")
          ELF

          # Start it the way a user does: the runtime mounts the payload itself,
          # which is the path that fails when a machine has only fuse3.
          sudo modprobe fuse || true
          if [[ ! -e /dev/fuse ]]; then
            echo "::error::this runner has no /dev/fuse, so a mounted AppImage cannot be proven here."
            exit 1
          fi
          DSH_LINUX_CHECK_LOG="$PWD/build/appimage-mounted.log" "./$appimage" --dsh-check-bundle
          test -s build/appimage-mounted.log
          cat build/appimage-mounted.log

          # And again inside a container that has no libfuse2: an AppImage that
          # needed the host's libfuse.so.2 dies here with a dlopen failure.
          cat > build/container-proof.sh <<'SH'
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends fuse3 ca-certificates >/dev/null
          if ldconfig -p | grep -qE 'libfuse\.so\.2'; then
            echo "libfuse.so.2 is present in this container; the proof is void." >&2
            exit 1
          fi
          appimage="$(ls /dist/Bitcoin-Easy-Signer-*-linux-x86_64.AppImage)"
          DSH_LINUX_CHECK_LOG=/work/container.log "$appimage" --dsh-check-bundle
          test -s /work/container.log
          SH
          # CT-99: a tag is a moving name; the proof image is pinned to the
          # multi-arch digest it resolved to when this pin was written. Refresh
          # with:
          #   docker buildx imagetools inspect ubuntu:24.04 --format '{{.Manifest.Digest}}'
          docker run --rm \
            --device /dev/fuse --cap-add SYS_ADMIN \
            --security-opt apparmor=unconfined \
            -v "$PWD/dist:/dist:ro" -v "$PWD/build:/work" \
            ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55 \
            bash -lc 'bash /work/container-proof.sh'
          cat build/container.log
      - name: Name the SBOM for one shared release page
        run: mv dist/BUILD-SBOM.json dist/BUILD-SBOM-linux-x86_64.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-desktop
          path: |
            dist/*.AppImage
            dist/*-linux-x86_64.tar.gz
            dist/BUILD-SBOM-linux-x86_64.json
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    needs: [version, source, macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      # Sigstore provenance attestation binds every asset to this workflow run.
      id-token: write
      attestations: write
    steps:
      - name: Download and verify the tested candidate artifacts
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          jq -e \
            --arg commit "$RELEASE_COMMIT" \
            '.event == "workflow_dispatch"
             and .status == "completed" and .conclusion == "success"
             and .head_branch == "main" and .head_sha == $commit
             and .path == ".github/workflows/build-candidate.yml"' \
            <<<"$run_json" >/dev/null || {
              echo "Candidate run must be successful, from this workflow, and from the exact release commit on main." >&2
              exit 1
            }
          mkdir -p "$RUNNER_TEMP/candidate-manifest" "$RUNNER_TEMP/candidate-source" \
            "$RUNNER_TEMP/candidate-macos" "$RUNNER_TEMP/candidate-windows" \
            "$RUNNER_TEMP/candidate-linux" "$RUNNER_TEMP/candidate-sums" dist
          gh run download "$CANDIDATE_RUN_ID" --name candidate-manifest \
            --dir "$RUNNER_TEMP/candidate-manifest"
          gh run download "$CANDIDATE_RUN_ID" --name source-archive \
            --dir "$RUNNER_TEMP/candidate-source"
          gh run download "$CANDIDATE_RUN_ID" --name macos-dmg \
            --dir "$RUNNER_TEMP/candidate-macos"
          gh run download "$CANDIDATE_RUN_ID" --name windows-bundle \
            --dir "$RUNNER_TEMP/candidate-windows"
          gh run download "$CANDIDATE_RUN_ID" --name linux-desktop \
            --dir "$RUNNER_TEMP/candidate-linux"
          gh run download "$CANDIDATE_RUN_ID" --name sha256sums \
            --dir "$RUNNER_TEMP/candidate-sums"
          manifest="$RUNNER_TEMP/candidate-manifest/CANDIDATE-MANIFEST.txt"
          test -f "$manifest"
          grep -Fx "version=$RELEASE_VERSION" "$manifest"
          grep -Fx "commit=$RELEASE_COMMIT" "$manifest"
          grep -Fx "run_id=$CANDIDATE_RUN_ID" "$manifest"
          grep -Fx "notarize=true" "$manifest"
          grep -Fx "publish=false" "$manifest"
          cp "$RUNNER_TEMP"/candidate-source/*.tar.gz dist/
          cp "$RUNNER_TEMP"/candidate-macos/*.dmg "$RUNNER_TEMP"/candidate-macos/BUILD-SBOM.json dist/
          cp "$RUNNER_TEMP"/candidate-windows/*.zip "$RUNNER_TEMP"/candidate-windows/BUILD-SBOM-windows-x64.json dist/
          cp "$RUNNER_TEMP"/candidate-linux/*.AppImage "$RUNNER_TEMP"/candidate-linux/*-linux-x86_64.tar.gz \
            "$RUNNER_TEMP"/candidate-linux/BUILD-SBOM-linux-x86_64.json dist/
          cp "$RUNNER_TEMP/candidate-sums/SHA256SUMS" dist/
          cd dist
          shasum -a 256 -c SHA256SUMS
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" = 2
          test "$(find . -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')" = 1
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l | tr -d ' ')" = 1
          test "$(find . -maxdepth 1 -name '*.AppImage' | wc -l | tr -d ' ')" = 1
          test -f BUILD-SBOM.json
          test -f BUILD-SBOM-windows-x64.json
          test -f BUILD-SBOM-linux-x86_64.json
      - name: Download current run artifacts for a nonpublishing candidate
        if: ${{ !inputs.publish }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-archive
          path: dist
      - name: Download current DMG and SBOM for a nonpublishing candidate
        if: ${{ !inputs.publish }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-dmg
          path: dist
      - name: Download current Windows bundle for a nonpublishing candidate
        if: ${{ !inputs.publish }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-bundle
          path: dist
      - name: Download current Linux assets for a nonpublishing candidate
        if: ${{ !inputs.publish }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-desktop
          path: dist
      - name: Write candidate checksums
        if: ${{ !inputs.publish }}
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\0' \
            | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          cat SHA256SUMS
      - name: Sign the checksum manifest with the release key
        # Only the publish path signs. A candidate must be promotable byte-for-byte,
        # so nothing about its files changes here; the signature is added over the
        # verified candidate sums. Publishing without the key fails closed with the
        # one-time setup in SIGNING.md.
        if: ${{ inputs.publish }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
            echo "GPG_PRIVATE_KEY is not set; a release cannot ship an unsigned" >&2
            echo "checksum manifest. See SIGNING.md for the one-time release-key setup." >&2
            exit 1
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          if [[ -n "${GPG_PASSPHRASE:-}" ]]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --armor --detach-sign --output dist/SHA256SUMS.asc dist/SHA256SUMS
          else
            gpg --batch --yes --armor --detach-sign \
              --output dist/SHA256SUMS.asc dist/SHA256SUMS
          fi
          gpg --verify dist/SHA256SUMS.asc dist/SHA256SUMS
      - name: Attest build provenance for every asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !inputs.publish }}
        with:
          name: sha256sums
          path: dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, source, macos, windows, linux, checksums]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist
      - name: Verify downloaded release bytes
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 -c SHA256SUMS
          if [[ "${{ inputs.publish }}" == "true" ]]; then
            # The publish path must carry the release-key signature, verified
            # against the public key committed in this repository (SIGNING.md).
            test -f SHA256SUMS.asc || { echo "SHA256SUMS.asc is missing." >&2; exit 1; }
            test -f ../signing-key.asc || { echo "signing-key.asc is not committed." >&2; exit 1; }
            gpg --batch --import ../signing-key.asc
            gpg --verify SHA256SUMS.asc SHA256SUMS
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # The title is the version. Nothing else.
          #
          # It used to carry "notarized Apple Silicon build" or "unsigned test
          # build", which described how the artifact was BUILT rather than what it
          # does. Notarization is now the normal state, so advertising it is like a
          # restaurant advertising that it has a roof; and "unsigned test build" was
          # never a release name at all. Apple Silicon stays out for the same reason:
          # it is the only architecture this app has ever shipped for.
          #
          # The tag is the identity. What changed for the reader belongs in the notes
          # below, where it can be a sentence instead of a suffix.
          release_title="$tag"
          if [[ "${{ inputs.notarize }}" == "true" ]]; then
            build_kind="The macOS download is signed with a Developer ID certificate and **notarized by Apple**, so it installs with a normal double-click. The Windows and Linux downloads are **unsigned**: their guarantee is provenance, not a certificate — every asset was built from this exact commit in one gated workflow run, is covered by the CI-generated \`SHA256SUMS\` and its release-key signature \`SHA256SUMS.asc\`, and carries a GitHub Sigstore build attestation. See \`SIGNING.md\`."
            dmg_name="Bitcoin-Easy-Signer-v${VERSION}-macOS.dmg"
          else
            build_kind="**Unsigned and unnotarized, every platform.** macOS will require right-click → Open on first launch. Built for testing, not for handing to anyone."
            dmg_name="Bitcoin-Easy-Signer-v${VERSION}-UNSIGNED-TEST.dmg"
          fi
          cat > notes.md <<EOF
          ## v${VERSION}

          ${build_kind}

          Built from \`${GITHUB_REF_NAME}\` at commit \`${GITHUB_SHA}\`.

          - Opens an existing BSMS native-SegWit multisig wallet with two or three physical keys; the file defines the quorum, and the app checks its public balance.
          - Prepares a partial send with a declared change branch or the guarded
            standard BIP48 /1/* branch anchored by the BSMS first receive address.
            Unsupported layouts can explicitly Send All without change. Shows final outputs and fee.
          - Refuses inferred change when a bare wildcard matches the first address
            directly instead of anchoring the BIP48 /0/0 receiving branch.
          - Uses bundled HWI 3.2.0 over stdin to request the number of hardware signatures required by the BSMS quorum.
            Only signatures verifying against the reviewed PSBT are retained;
            signer-returned metadata is discarded before finalization.
          - Gives each device discovery and authorization check up to three minutes and deliberate on-device signing
            up to ten minutes, including Ledger's multiple review screens.
          - Offers Bitcoin mainnet plus the Testnet4 and Mutinynet practice networks
            through one engine. The practice networks are a test bench for developers,
            not what this app is for. A custom-Signet checkpoint distinguishes Mutinynet
            from ordinary Signet.
            A new Mutinynet wallet and practice coins are required; Testnet4 coins
            do not transfer across networks.
          - Opens on Bitcoin mainnet. The practice networks are reached only through
            the "Enter Developer Mode" gate on the opening screen, which asks for
            confirmation first and lasts for the session: the app reopens on mainnet.
            Inside the gate the choice is Mutinynet or Testnet4: live Bitcoin is the
            network the gate returns to, not one of its options.
            Send All is never preselected; a nonstandard wallet without an established
            change branch explains why a smaller payment is unavailable.
          - Clears old signer/final details whenever a new payment is prepared,
            including the network the retired final screen was bound to.
            Rechecks selected confirmed outputs before preparation and broadcast;
            a lost broadcast response is treated as outcome unknown, never retried.
          - Broadcasts on the selected network after a separate confirmation. Mainnet
            submission needs one explicit confirmation on the final screen and a backend
            opt-in that fails closed when omitted. It never asks for a PIN or seed.
          - Saves an optional unsigned PSBT and an opt-in privacy-limited diagnostic
            report. Dependencies are hash-locked; native libusb digest is required.

          Downloads — every platform built from this exact commit in one gated run:

          - \`${dmg_name}\` — macOS, Apple Silicon
          - \`Bitcoin-Easy-Signer-v${VERSION}-windows-x64.zip\` — Windows x64
          - \`Bitcoin-Easy-Signer-v${VERSION}-linux-x86_64.AppImage\` — Linux x86_64
          - \`Bitcoin-Easy-Signer-v${VERSION}-linux-x86_64.tar.gz\` — Linux x86_64, unpackaged
          - \`bitcoin-easy-multisig-signer-v${VERSION}.tar.gz\` — source

          Verify any download against \`SHA256SUMS\` and its release-key signature
          \`SHA256SUMS.asc\` (the public key is \`signing-key.asc\` in this repository),
          and check each file's GitHub Sigstore build attestation.
          \`BUILD-SBOM.json\`, \`BUILD-SBOM-windows-x64.json\` and
          \`BUILD-SBOM-linux-x86_64.json\` inventory each packaged environment and its
          native libusb.

          **Use at your own risk.** Bitcoin Easy Signer is free, open-source software
          maintained by Bitseeker LLC, without warranty or guarantee. Real Bitcoin can be
          sent from this build: verify the destination, amount and fee on your signing
          devices before approving, and treat an unconfirmed payment as unfinished.
          Hardware signers commonly hide the change output, so check the change address
          in the wallet software that holds the wallet file, not on a device screen.
          EOF
          release_notes="releases/RELEASE-NOTES-${VERSION}.md"
          if [[ -f "$release_notes" ]]; then
            printf '\n' >> notes.md
            cat "$release_notes" >> notes.md
          fi
          # publish=false stops here, before anything is created. A dispatch that
          # builds a candidate must be able to test the exact artifact a release
          # would ship without committing the version to it: publishing is
          # irreversible by policy below, so the alternative is bumping the version
          # to correct a build nobody had opened yet. No tag is created and no
          # release exists, so nothing is downloadable by the public; the DMG and
          # the source archive stay attached to this workflow run as artifacts.
          if [[ "${{ inputs.publish }}" != "true" ]]; then
            cat > dist/CANDIDATE-MANIFEST.txt <<EOF
          version=${VERSION}
          commit=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          notarize=${{ inputs.notarize }}
          publish=${{ inputs.publish }}
          EOF
            {
              echo "### Candidate build of v${VERSION} — not published"
              echo
              echo "Nothing was published and no tag was created. The release notes"
              echo "this run would have used are in \`notes.md\` below."
              echo
              echo "Download the \`macos-dmg\`, \`windows-bundle\` and \`linux-desktop\`"
              echo "artifacts for the platform builds and their SBOMs, and"
              echo "\`sha256sums\` for \`SHA256SUMS\`."
              echo
              echo "Expected DMG name: \`${dmg_name}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "==> Candidate build: v${VERSION} was built and NOT published."
            cat notes.md
            exit 0
          fi
          if [[ "${{ inputs.notarize }}" != "true" ]]; then
            echo "Refusing to publish an unsigned or unnotarized build." >&2
            exit 1
          fi
          # A published version is never rebuilt. Overwriting one silently changes the
          # artifacts behind a tag someone has already downloaded and verified, which
          # is exactly what happened to v0.1.11 five times. If this version is already
          # published, bump version.py and push again.
          tag_status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || tag_status=$?
          if [[ "$tag_status" == 0 ]]; then
            echo "==> The tag $tag already exists." >&2
            echo "    Bump version.py rather than republishing a released version." >&2
            exit 1
          fi
          if [[ "$tag_status" != 2 ]]; then
            echo "Could not verify remote tag state; refusing publication." >&2
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$release_title" \
            --notes-file notes.md dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        name: Retain signed candidate provenance for automated promotion
        if: ${{ !inputs.publish }}
        with:
          name: candidate-manifest
          path: dist/CANDIDATE-MANIFEST.txt
          if-no-files-found: error
