name: Build Windows bundle and release

# Windows counterpart of the audited macOS candidate/release pipeline.
#
# The shape is deliberately identical: a `publish=false` dispatch builds and
# uploads a candidate, and only a later `publish=true` dispatch from the same
# commit with that candidate's run id promotes the very bytes that were tested.
# A published version is never rebuilt.
#
# One thing is different. The macOS pipeline refuses to publish unless the artifact
# carries a Developer ID signature. There is no Windows signing path yet, so
# publishing an unsigned build is refused unless the dispatcher also sets
# `allow_unsigned`, and that acknowledgement is recorded in the candidate manifest.
# The safe answer stays the default: a plain dispatch cannot publish.
#
# The other difference is where this file lives. The audited macOS release was cut
# from main, and that release has to keep meaning exactly what it meant. So the
# Windows port lives on its own branch, `windows-port`, and everything below is run
# there. Main is never modified, and this pipeline publishes under its own tag
# rather than rewriting an audited one.

on:
  # A workflow that exists only on a non-default branch is not offered in the
  # "Run workflow" list yet, so the first run has to arrive from somewhere else.
  # A push of the Windows branch builds a `publish=false` candidate and stops;
  # publication still needs a dispatch naming that candidate's run id. Once this
  # file has run once, the GitHub CLI can dispatch it by name against any branch.
  push:
    branches:
      - windows-port
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built artifacts as a GitHub release
        type: boolean
        default: false
      allow_unsigned:
        description: Also required to publish, because this build is not code-signed
        type: boolean
        default: false
      candidate_run_id:
        description: Run id of the tested publish=false candidate to promote
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Require the Windows branch for publication
        if: ${{ inputs.publish }}
        env:
          GITHUB_REF: ${{ github.ref }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          # The audited macOS release came from main. This one cannot, because main
          # is frozen at the v0.6.4 audit: a Windows release is published from the
          # windows-port branch, and its tag points at a commit on that branch.
          if [[ "$GITHUB_REF" != "refs/heads/windows-port" ]]; then
            echo "Refusing to publish from $GITHUB_REF; Windows releases come from" >&2
            echo "the windows-port branch." >&2
            exit 1
          fi
          if [[ -z "$CANDIDATE_RUN_ID" ]]; then
            echo "Publishing needs candidate_run_id: the run id of the publish=false" >&2
            echo "dispatch whose artifacts were tested." >&2
            exit 1
          fi
          if ! [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "candidate_run_id must be the numeric run id, not '$CANDIDATE_RUN_ID'." >&2
            exit 1
          fi
      - name: Require an unsigned publication to be acknowledged
        if: ${{ inputs.publish }}
        env:
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
        run: |
          set -euo pipefail
          # This is not a developer convenience switch: it is the statement that
          # shipping an unsigned executable to users is intended. Windows will show
          # a SmartScreen warning on first run, and nothing in this repository can
          # currently prove the download came from here.
          if [[ "$ALLOW_UNSIGNED" != "true" ]]; then
            echo "This build is not code-signed, and no Authenticode certificate is" >&2
            echo "configured, so Windows cannot verify its publisher." >&2
            echo "Re-dispatch with allow_unsigned=true as well as publish=true only if" >&2
            echo "shipping an unsigned executable is genuinely intended." >&2
            exit 1
          fi
      - name: Read version
        id: read
        run: |
          set -euo pipefail
          version="$(python3 -c 'import ast, pathlib; module = ast.parse(pathlib.Path("version.py").read_text(encoding="utf-8")); print([ast.literal_eval(node.value) for node in module.body if isinstance(node, ast.Assign) and any(getattr(target, "id", None) == "APP_VERSION" for target in node.targets)][0])')"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version.py holds '$version', which is not a numeric version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "==> Building Windows bundle v${version}."

  source:
    name: Source archive and tests
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # PyYAML lives in requirements-ci.lock, never in the app's own dependency
      # list: a test dependency must not become a shipped one.
      - name: Install the locked app dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - name: Install the locked CI-only dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.lock
      - name: Run the suite and refuse a silent skip
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee suite.log
          if grep -qE 'skipped=[1-9]' suite.log; then
            echo "==> A test skipped itself; this job has no environment excuse." >&2
            exit 1
          fi
      - name: Run the UI DOM tests
        run: |
          set -euo pipefail
          for test in tests/ui_*.cjs; do
            echo "==> $test"
            node "$test"
          done
      - name: Build the curated source archive
        run: |
          set -euo pipefail
          bash scripts/build-source.sh "${{ needs.version.outputs.version }}"
      - name: Re-run the suite from inside the archive
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          destination="$RUNNER_TEMP/from-archive"
          mkdir -p "$destination"
          tar xzf "dist/bitcoin-easy-multisig-signer-v${version}.tar.gz" -C "$destination"
          cd "$destination/bitcoin-easy-multisig-signer-v${version}"
          python -m unittest discover -s tests -v 2>&1 | tee suite.log
          if grep -qE 'skipped=[1-9]' suite.log; then
            echo "==> A test skipped itself inside the released archive." >&2
            exit 1
          fi
          for test in tests/ui_*.cjs; do
            echo "==> $test"
            node "$test"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-archive
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x64 bundle
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Require an x64 Windows runner
        run: |
          set -euo pipefail
          architecture="${PROCESSOR_ARCHITEW6432:-$PROCESSOR_ARCHITECTURE}"
          if [[ "$architecture" != "AMD64" ]]; then
            echo "This job builds a 64-bit Windows bundle; the runner reports $architecture." >&2
            exit 1
          fi
      - name: Verify the Windows build inputs are present
        run: |
          set -euo pipefail
          missing=()
          # Neither of these can be produced on the machine that writes this
          # workflow: the lock must be resolved on Windows and the DLL must be
          # compiled on Windows. They are generated once by
          # .github/workflows/windows-inputs.yml, reviewed, and committed.
          [[ -f requirements-desktop-windows.lock ]] || missing+=(requirements-desktop-windows.lock)
          [[ -f vendor/libusb-1.0.dll ]] || missing+=(vendor/libusb-1.0.dll)
          if (( ${#missing[@]} )); then
            echo "Missing Windows build input(s): ${missing[*]}" >&2
            echo "Dispatch .github/workflows/windows-inputs.yml, review its artifacts," >&2
            echo "and commit them as vendor/README.md explains." >&2
            exit 1
          fi
      - name: Verify the vendored libusb input
        env:
          LIBUSB_SHA256: ${{ vars.LIBUSB_WINDOWS_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "${LIBUSB_SHA256:-}" ]]; then
            echo "Set the LIBUSB_WINDOWS_SHA256 repository variable to the reviewed" >&2
            echo "SHA-256 of vendor/libusb-1.0.dll before building a release." >&2
            exit 1
          fi
          expected="$(printf '%s' "$LIBUSB_SHA256" | tr 'A-Z' 'a-z')"
          observed_line="$(sha256sum vendor/libusb-1.0.dll)"
          observed="${observed_line%% *}"
          if [[ "$observed" != "$expected" ]]; then
            echo "vendor/libusb-1.0.dll does not match LIBUSB_WINDOWS_SHA256." >&2
            echo "  expected $expected" >&2
            echo "  observed $observed" >&2
            exit 1
          fi
      - name: Install the locked app dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - name: Install the locked CI-only dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.lock
      - name: Run the suite and refuse a silent skip
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee suite.log
          if grep -qE 'skipped=[1-9]' suite.log; then
            echo "==> A test skipped itself; the Windows job has no excuse for that." >&2
            exit 1
          fi
      - name: Run the UI DOM tests
        run: |
          set -euo pipefail
          for test in tests/ui_*.cjs; do
            echo "==> $test"
            node "$test"
          done
      # Dependencies are installed and the lock digest is recorded BEFORE the
      # build runs, so a build that needs to install something is a visible
      # failure rather than a quiet network fetch halfway through.
      - name: Prepare the hash-locked build environment
        shell: pwsh
        env:
          PREPARE_ONLY: "1"
        run: ./scripts/build-windows.ps1 -Version "${{ needs.version.outputs.version }}"
      - name: Build the Windows bundle
        shell: pwsh
        env:
          LIBUSB_SHA256: ${{ vars.LIBUSB_WINDOWS_SHA256 }}
          BUILD_DEPS_PREPARED: "1"
        run: ./scripts/build-windows.ps1 -Version "${{ needs.version.outputs.version }}"
      - name: Verify the built bundle
        run: |
          set -euo pipefail
          app="dist/Bitcoin Easy Signer"
          exe="$app/Bitcoin Easy Signer.exe"
          hwi="$app/hwi.exe"
          test -f "$exe" || { echo "Missing $exe" >&2; exit 1; }
          test -f "$hwi" || { echo "Missing $hwi" >&2; exit 1; }
          "$hwi" --help > hwi-help.log
          printf '%s\n' 'enumerate' | "$hwi" --chain test --stdin > hwi-stdin.json
          python -m json.tool < hwi-stdin.json > /dev/null
          # The app's own headless self-checks, each redirected to a file first:
          # a --windowed executable has no console of its own, so relying on the
          # runner's pipe would be relying on something the app does not control.
          for flag in --check-bundle --check-save --check-network --check-devices; do
            name="${flag#--}"
            if ! "$exe" "$flag" > "$name.log" 2>&1; then
              echo "==> $flag failed:" >&2
              cat "$name.log" >&2
              exit 1
            fi
            if [[ ! -s "$name.log" ]]; then
              echo "==> $flag printed nothing; a silent pass is not a pass." >&2
              exit 1
            fi
          done
          # A host with a CA file configured must not be what makes HTTPS work.
          # On Windows the OS certificate store is the ambient source of trust, so
          # the load-bearing check is --check-bundle above: it asserts that the
          # BUNDLED store is the one the app configured for use.
          SSL_CERT_FILE=/nonexistent/ca.pem "$exe" --check-network > ca-file.log 2>&1
          SSL_CERT_DIR=/nonexistent/certs "$exe" --check-network > ca-dir.log 2>&1
      # The inventory comes first because the layout check reads dist/BUILD-SBOM.json
      # and refuses a release that ships without one.
      - name: Inventory the built dependencies
        env:
          LIBUSB_SHA256: ${{ vars.LIBUSB_WINDOWS_SHA256 }}
        run: |
          set -euo pipefail
          ./.build-venv/Scripts/python.exe scripts/build-sbom.py \
            --libusb-sha "$LIBUSB_SHA256" --output dist/BUILD-SBOM.json
      - name: Check the bundle's layout, icon and archive
        run: |
          set -euo pipefail
          ./.build-venv/Scripts/python.exe scripts/verify-windows-bundle.py \
            --version "${{ needs.version.outputs.version }}" \
            --sbom dist/BUILD-SBOM.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-bundle
          path: |
            dist/*.zip
            dist/BUILD-SBOM.json
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    needs: [version, source, windows]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download and verify the tested candidate artifacts
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Verify the claimed candidate really is a completed publish=false run of
          # this workflow, from this commit, on the Windows branch. Without this the
          # run id would just be a number somebody typed into a box.
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          jq -e \
            --arg commit "$RELEASE_COMMIT" \
            '.event == "workflow_dispatch"
             and .status == "completed" and .conclusion == "success"
             and .head_branch == "windows-port" and .head_sha == $commit
             and .path == ".github/workflows/build-windows.yml"' \
            <<<"$run_json" >/dev/null || {
              echo "Candidate run must be successful, from this workflow, and from the exact release commit on the windows-port branch." >&2
              exit 1
            }
          mkdir -p "$RUNNER_TEMP/candidate-manifest" "$RUNNER_TEMP/candidate-source" \
            "$RUNNER_TEMP/candidate-windows" "$RUNNER_TEMP/candidate-sums" dist
          gh run download "$CANDIDATE_RUN_ID" --name candidate-manifest \
            --dir "$RUNNER_TEMP/candidate-manifest"
          gh run download "$CANDIDATE_RUN_ID" --name source-archive \
            --dir "$RUNNER_TEMP/candidate-source"
          gh run download "$CANDIDATE_RUN_ID" --name windows-bundle \
            --dir "$RUNNER_TEMP/candidate-windows"
          gh run download "$CANDIDATE_RUN_ID" --name sha256sums \
            --dir "$RUNNER_TEMP/candidate-sums"
          manifest="$RUNNER_TEMP/candidate-manifest/CANDIDATE-MANIFEST.txt"
          test -f "$manifest"
          grep -Fx "version=$RELEASE_VERSION" "$manifest"
          grep -Fx "commit=$RELEASE_COMMIT" "$manifest"
          grep -Fx "run_id=$CANDIDATE_RUN_ID" "$manifest"
          grep -Fx "allow_unsigned=true" "$manifest"
          grep -Fx "publish=false" "$manifest"
          cp "$RUNNER_TEMP"/candidate-source/*.tar.gz dist/
          cp "$RUNNER_TEMP"/candidate-windows/*.zip "$RUNNER_TEMP"/candidate-windows/BUILD-SBOM.json dist/
          cp "$RUNNER_TEMP/candidate-sums/SHA256SUMS" dist/
          cd dist
          sha256sum -c SHA256SUMS
          # Promoting more or fewer files than the candidate produced would mean
          # shipping something nobody tested.
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" = 1
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l | tr -d ' ')" = 1
          test -f BUILD-SBOM.json
      - name: Download current run artifacts for a nonpublishing candidate
        if: ${{ !inputs.publish }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source-archive
          path: dist
      - name: Download current Windows bundle and SBOM for a nonpublishing candidate
        if: ${{ !inputs.publish }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-bundle
          path: dist
      - name: Write candidate checksums
        if: ${{ !inputs.publish }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip BUILD-SBOM.json > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !inputs.publish }}
        with:
          name: sha256sums
          path: dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, source, windows, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist
      - name: Verify downloaded release bytes
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # The audited macOS release owns the plain `vX.Y.Z` tag, and a published
          # release is never rewritten. This pipeline tags its own work with the
          # platform suffix, so both releases sit side by side on one Releases page
          # without either one claiming the other's version.
          tag="v${VERSION}-windows-x64"
          release_title="$tag"
          zip_name="Bitcoin-Easy-Signer-v${VERSION}-windows-x64.zip"
          # There is no signed Windows build yet, so every artifact this pipeline
          # can produce is unsigned. Say so plainly, and say what the reader has
          # to do about it.
          build_kind="**Unsigned.** This build carries no code signature, so Windows SmartScreen will warn on first run: choose *More info* → *Run anyway*. Built for testing, not for handing to anyone."
          cat > notes.md <<EOF
          ## v${VERSION}

          ${build_kind}

          Built from \`${GITHUB_REF_NAME}\` at commit \`${GITHUB_SHA}\`.

          - Opens an existing BSMS native-SegWit multisig wallet with two or three physical keys; the file defines the quorum, and the app checks its public balance.
          - Prepares a partial send with a declared change branch or the guarded
            standard BIP48 /1/* branch anchored by the BSMS first receive address.
            Unsupported layouts can explicitly Send All without change. Shows final outputs and fee.
          - Refuses inferred change when a bare wildcard matches the first address
            directly instead of anchoring the BIP48 /0/0 receiving branch.
          - Uses bundled HWI 3.2.0 over stdin to request the number of hardware signatures required by the BSMS quorum.
            Only signatures verifying against the reviewed PSBT are retained;
            signer-returned metadata is discarded before finalization.
          - Gives each device discovery and authorization check up to three minutes and deliberate on-device signing
            up to ten minutes, including Ledger's multiple review screens.
          - Offers Bitcoin mainnet plus the Testnet4 and Mutinynet practice networks
            through one engine. The practice networks are a test bench for developers,
            not what this app is for. A custom-Signet checkpoint distinguishes Mutinynet
            from ordinary Signet.
            A new Mutinynet wallet and practice coins are required; Testnet4 coins
            do not transfer across networks.
          - Opens on Bitcoin mainnet. The practice networks are reached only through
            the "Enter Developer Mode" gate on the opening screen, which asks for
            confirmation first and lasts for the session: the app reopens on mainnet.
            Inside the gate the choice is Mutinynet or Testnet4: live Bitcoin is the
            network the gate returns to, not one of its options.
            Send All is never preselected; a nonstandard wallet without an established
            change branch explains why a smaller payment is unavailable.
          - Clears old signer/final details whenever a new payment is prepared,
            including the network the retired final screen was bound to.
            Rechecks selected confirmed outputs before preparation and broadcast;
            a lost broadcast response is treated as outcome unknown, never retried.
          - Broadcasts on the selected network after a separate confirmation. Mainnet
            submission needs one explicit confirmation on the final screen and a backend
            opt-in that fails closed when omitted. It never asks for a PIN or seed.
          - Saves an optional unsigned PSBT and an opt-in privacy-limited diagnostic
            report. Dependencies are hash-locked; native libusb digest is required.

          Downloads: \`${zip_name}\` (64-bit Windows;
          unpack it and run \`Bitcoin Easy Signer.exe\`) and
          \`bitcoin-easy-multisig-signer-v${VERSION}.tar.gz\` (source).
          Verify either file against \`SHA256SUMS\`.
          \`BUILD-SBOM.json\` inventories the packaged Python environment and native libusb.

          This build needs the Microsoft Edge WebView2 runtime, which is present on
          current Windows 10 and Windows 11 installations and is a free download from
          Microsoft otherwise.

          **Use at your own risk.** Bitcoin Easy Signer is free, open-source software
          maintained by Bitseeker LLC, without warranty or guarantee. Real Bitcoin can be
          sent from this build: verify the destination, amount and fee on your signing
          devices before approving, and treat an unconfirmed payment as unfinished.
          Hardware signers commonly hide the change output, so check the change address
          in the wallet software that holds the wallet file, not on a device screen.
          EOF
          release_notes="releases/RELEASE-NOTES-${VERSION}.md"
          if [[ -f "$release_notes" ]]; then
            printf '\n' >> notes.md
            cat "$release_notes" >> notes.md
          fi
          # publish=false stops here, before anything is created. A dispatch that
          # builds a candidate must be able to test the exact artifact a release
          # would ship without committing the version to it: publishing is
          # irreversible by policy below, so the alternative is bumping the version
          # to correct a build nobody had opened yet. No tag is created and no
          # release exists, so nothing is downloadable by the public; the zip and
          # the source archive stay attached to this workflow run as artifacts.
          if [[ "${{ inputs.publish }}" != "true" ]]; then
            cat > dist/CANDIDATE-MANIFEST.txt <<EOF
          version=${VERSION}
          commit=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          allow_unsigned=${{ inputs.allow_unsigned }}
          publish=${{ inputs.publish }}
          EOF
            {
              echo "### Candidate build of v${VERSION} — not published"
              echo
              echo "Nothing was published and no tag was created. The release notes"
              echo "this run would have used are in \`notes.md\` below."
              echo
              echo "Download the \`windows-bundle\` artifact for the zip and"
              echo "\`BUILD-SBOM.json\`, and \`sha256sums\` for \`SHA256SUMS\`."
              echo
              echo "Expected zip name: \`${zip_name}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "==> Candidate build: v${VERSION} was built and NOT published."
            cat notes.md
            exit 0
          fi
          if [[ "${{ inputs.allow_unsigned }}" != "true" ]]; then
            echo "Refusing to publish an unsigned build without allow_unsigned=true." >&2
            exit 1
          fi
          # A published version is never rebuilt. Overwriting one silently changes the
          # artifacts behind a tag someone has already downloaded and verified, which
          # is exactly what happened to v0.1.11 five times. If this version is already
          # published, bump version.py and push again.
          tag_status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || tag_status=$?
          if [[ "$tag_status" == 0 ]]; then
            echo "==> The tag $tag already exists." >&2
            echo "    Bump version.py rather than republishing a released version." >&2
            exit 1
          fi
          if [[ "$tag_status" != 2 ]]; then
            echo "Could not verify remote tag state; refusing publication." >&2
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$release_title" \
            --notes-file notes.md dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        name: Retain candidate provenance for automated promotion
        if: ${{ !inputs.publish }}
        with:
          name: candidate-manifest
          path: dist/CANDIDATE-MANIFEST.txt
          if-no-files-found: error
