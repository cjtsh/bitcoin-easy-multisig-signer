name: Build and publish v0.1.10 test release

on:
  push:
    branches:
      - phase2-transaction-builder
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: bash scripts/build-source.sh 0.1.10
      - uses: actions/upload-artifact@v4
        with:
          name: source-0.1.10
          path: dist/bitcoin-easy-multisig-signer-v0.1.10.tar.gz
          if-no-files-found: error

  macos-apple-silicon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: brew install libusb
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: bash scripts/build-macos.sh 0.1.10
      - name: Check DMG and app resources
        run: |
          hdiutil verify dist/Bitcoin-Easy-Signer-v0.1.10-UNSIGNED-TEST.dmg
          test -f "dist/Bitcoin Easy Signer.app/Contents/Info.plist"
          test -x "dist/Bitcoin Easy Signer.app/Contents/MacOS/hwi"
          "dist/Bitcoin Easy Signer.app/Contents/MacOS/hwi" --help >/dev/null
          "dist/Bitcoin Easy Signer.app/Contents/MacOS/Bitcoin Easy Signer" --check-bundle
          "dist/Bitcoin Easy Signer.app/Contents/MacOS/Bitcoin Easy Signer" --check-network
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-macos-apple-silicon-0.1.10
          path: dist/Bitcoin-Easy-Signer-v0.1.10-UNSIGNED-TEST.dmg
          if-no-files-found: error

  publish-test-release:
    if: github.event_name == 'push'
    needs: [source, macos-apple-silicon]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-0.1.10
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-macos-apple-silicon-0.1.10
          path: dist
      - name: Publish a regular GitHub release with both downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## v0.1.10 test build

          This is an unsigned Apple Silicon test build from the phase2-transaction-builder branch. It completes transaction preparation through read-only hardware signer recognition. It is not merged into main.

          It supports a Yes/No start, partial amount or Send All, live slow/medium/fast fee suggestions, sats and indicative USD fee review, and an additional confirmation for mainnet payments estimated at $10,000 or more. It creates an unsigned PSBT, then uses bundled Bitcoin Core HWI 3.2.0 to identify connected devices whose public keys match this wallet. It does not collect PINs, sign, or broadcast.

          Mac download: unsigned and unnotarized Apple Silicon DMG.
          Linux/source download: source archive; requires Python as documented.
          EOF
          if gh release view v0.1.10 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.1.10 --repo "$GITHUB_REPOSITORY" --clobber dist/Bitcoin-Easy-Signer-v0.1.10-UNSIGNED-TEST.dmg dist/bitcoin-easy-multisig-signer-v0.1.10.tar.gz
            gh release edit v0.1.10 --repo "$GITHUB_REPOSITORY" --title "v0.1.10 — transaction and signer recognition test build" --notes-file release-notes.md --latest
          else
            gh release create v0.1.10 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v0.1.10 — transaction and signer recognition test build" --latest --notes-file release-notes.md dist/Bitcoin-Easy-Signer-v0.1.10-UNSIGNED-TEST.dmg dist/bitcoin-easy-multisig-signer-v0.1.10.tar.gz
          fi
